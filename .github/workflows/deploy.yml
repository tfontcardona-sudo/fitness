# Despliegue AUTOMÁTICO al VPS: cada vez que main cambia (merge de una PR),
# esta acción entra por SSH al servidor, trae el código y reconstruye los
# contenedores. Así "fusionar = desplegar" — nadie tiene que tocar la terminal.
#
# REQUISITO (una sola vez): en GitHub → Settings → Secrets and variables →
# Actions → New repository secret, crear:
#   VPS_HOST      46.225.57.25
#   VPS_USER      root
#   VPS_PASSWORD  (la contraseña SSH del servidor)
# Sin esos secretos, la acción falla sin tocar nada (el servidor sigue igual).
#
# SECRETO OPCIONAL (necesario SOLO si el repositorio pasa a PRIVADO):
#   GH_PAT   Personal Access Token de GitHub con permiso de LECTURA del repo
#            (Fine-grained token → Repository access: solo este repo →
#             Contents: Read-only). Con el repo privado, un `git pull` anónimo
#            fallaría; si GH_PAT está definido, el pull se autentica con él SIN
#            guardar el token en el disco del servidor (se pasa como cabecera
#            efímera). Si el repo sigue público, no hace falta y el pull normal
#            funciona igual.
#
# También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch).

name: Desplegar en el VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar por SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          command_timeout: 30m
          # El token viaja al servidor como variable de entorno (no queda en el
          # YAML ni en el código). Vacío si el repo aún es público.
          envs: GH_PAT
          script: |
            set -e
            cd /root/fitness
            if [ -n "${GH_PAT}" ]; then
              # Repo privado: autentica el pull con una cabecera efímera (el
              # token NO se persiste en .git/config ni en el historial de shell).
              AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GH_PAT}" | base64 | tr -d '\n')"
              git -c http.extraheader="${AUTH}" pull origin main
            else
              # Repo público: pull normal, sin credenciales.
              git pull origin main
            fi
            # Zombis de un recreate interrumpido ("abc123_fitness-system-api-1"):
            # docker compose renombra el contenedor viejo con ese prefijo antes
            # de sustituirlo; si un despliegue se cortó ahí, el zombi se queda y
            # BLOQUEA el rename del siguiente (deploy #13 falló por esto). Nunca
            # son un servicio vivo — los servicios se llaman fitness-system-*-N.
            docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{10,}_fitness-system-' | xargs -r docker rm -f || true
            docker compose up -d --build
            docker compose ps
            # --- COMPROBACIÓN REAL DE VIDA en dos capas ---
            # 1) BLOQUEANTE — la API dentro del propio contenedor: el arranque
            #    aplica migraciones y seeds; si eso falla, el contenedor muere
            #    en bucle DESPUÉS del "up" y este workflow quedaba verde con
            #    el backend roto. Si no contesta, se vuelcan sus logs SIN las
            #    líneas de peticiones (llevan tokens de portal en la URL y
            #    este repo es público) y el despliegue FALLA a la vista.
            sleep 12
            docker compose ps
            ok=""
            for i in 1 2 3 4 5 6; do
              if docker compose exec -T api curl -s --max-time 8 \
                   http://localhost:8000/api/public/plan-prices | grep -q '"tiers"'; then
                ok=1; break
              fi
              sleep 5
            done
            if [ -z "$ok" ]; then
              echo "❌ La API no responde tras el despliegue. Últimos logs (sin peticiones):"
              docker compose logs api --tail 120 2>&1 | grep -v ' HTTP/1.1" ' || true
              exit 1
            fi
            echo "✅ API viva (migraciones y arranque OK)."
            # 2) INFORMATIVO — el dominio público vía Caddy (el camino real de
            #    un cliente). NO tumba el deploy: un DNS caído o un certificado
            #    pendiente están FUERA del servidor, pero hay que VERLO aquí.
            #    (25-08-2026: dqrassessories.com se quedó SIN registro A en
            #    Namecheap — la web "no iba" con el servidor perfecto.)
            echo "— Dominio que espera Caddy:"
            docker compose exec -T web printenv DOMAIN || echo "(DOMAIN vacío: sirve en :80)"
            if curl -sk --max-time 10 --resolve dqrassessories.com:443:127.0.0.1 \
                 https://dqrassessories.com/api/public/plan-prices | grep -q '"tiers"'; then
              echo "✅ HTTPS del dominio OK desde el VPS."
            else
              echo "⚠️ El HTTPS del dominio NO responde desde el VPS (¿DNS/certificado?). Logs de Caddy:"
              docker compose logs web --tail 25 || true
            fi
            # Las imágenes colgantes de cada rebuild se acumulan y acaban
            # llenando el disco del VPS: fuera las que ya no usa nadie.
            docker image prune -f
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
