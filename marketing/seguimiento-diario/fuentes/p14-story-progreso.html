<!doctype html><html lang="es"><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<body><div class="story grain" style="background:
  radial-gradient(120% 50% at 88% -5%,#233754 0%,transparent 58%),
  linear-gradient(180deg,#0C1322 0%,#070B14 70%)">
  <div class="over" style="padding:96px 84px 190px;justify-content:space-between">
    <div>
      <span class="kicker">Sin fe ciega</span>
      <h1 class="display" style="font-size:118px;margin:28px 0 10px">Tu progreso,<br><span class="gold">negro sobre oro.</span></h1>
      <p class="hand gold" style="font-size:52px">si no se mide, no cuenta.</p>
    </div>
    <div class="card" style="padding:46px 48px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px">
        <b style="font-size:30px">Tendencia de peso</b><span class="num" style="font-size:44px;color:var(--gold)">−3,2 kg</span></div>
      <svg viewBox="0 0 800 210" style="width:100%;display:block">
        <polyline points="0,40 100,52 200,48 300,78 400,92 500,110 600,128 700,150 800,158"
          fill="none" stroke="#F6A560" stroke-width="7" stroke-linecap="round"/>
        <polyline points="0,40 100,52 200,48 300,78 400,92 500,110 600,128 700,150 800,158 800,210 0,210"
          fill="rgba(246,165,96,.12)" stroke="none"/>
      </svg>
      <div style="display:flex;justify-content:space-between;font-size:22px;color:var(--paper-faint);font-weight:700;margin-top:10px">
        <span>SEM 1</span><span>SEM 3</span><span>SEM 5</span><span>SEM 8</span></div>
      <div style="height:1.5px;background:var(--line);margin:34px 0"></div>
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px">
        <b style="font-size:30px">Fuerza (e1RM)</b><span class="num" style="font-size:44px;color:var(--green)">+9 %</span></div>
      <div style="display:flex;gap:14px;align-items:flex-end;height:120px">
        <div style="flex:1;height:52%;background:rgba(244,239,232,.16);border-radius:10px 10px 4px 4px"></div>
        <div style="flex:1;height:58%;background:rgba(244,239,232,.2);border-radius:10px 10px 4px 4px"></div>
        <div style="flex:1;height:66%;background:rgba(246,165,96,.5);border-radius:10px 10px 4px 4px"></div>
        <div style="flex:1;height:74%;background:rgba(246,165,96,.7);border-radius:10px 10px 4px 4px"></div>
        <div style="flex:1;height:88%;background:linear-gradient(180deg,var(--gold),var(--brand));border-radius:10px 10px 4px 4px"></div>
        <div style="flex:1;height:100%;background:linear-gradient(180deg,var(--gold),var(--brand));border-radius:10px 10px 4px 4px;box-shadow:0 10px 40px rgba(232,131,58,.4)"></div>
      </div>
    </div>
    <p style="font-size:37px;font-weight:600;color:var(--paper-dim);line-height:1.42">
      Estas gráficas salen de tu app y las repasamos juntos cada revisión.
      <b style="color:var(--paper)">Verte avanzar también engancha.</b></p>
  </div>
  <div class="foot"><span class="brand"><img src="../../../frontend/public/dq-logo.png">DQR</span><span class="url">app.dqrassessories.com</span></div>
</div></body></html>
