# Nombre PROPIO del proyecto: aísla contenedores, red y VOLÚMENES de otras
# instancias del motor en el mismo PC (p. ej. DQR usa "fitness-system"; con el
# mismo nombre, Docker compartiría su base de datos — nunca deben mezclarse).
name: professional-fitness

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitness}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitness}
      POSTGRES_DB: ${POSTGRES_DB:-fitness}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitness} -d ${POSTGRES_DB:-fitness}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      STORAGE_PATH: /storage
    volumes:
      - ./storage:/storage
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-}
    # 80 y 443 son los de Caddy EN PRODUCCIÓN, y ahí no se tocan (sin las
    # variables puestas, salen exactamente 80 y 443 como siempre). Se pueden
    # mover porque en DESARROLLO este servicio no es Caddy: docker-compose.dev
    # lo sustituye por el servidor de Vite, que escucha en 5173 y deja el 80 y
    # el 443 publicados para nada. En Windows el 80 suele estar cogido (IIS,
    # Skype, otro proyecto), el contenedor no llegaba a arrancar y la API sí:
    # el lanzador decía "DEMO LISTA" y localhost:5173 no abría. El lanzador los
    # aparta a puertos altos; compose no permite QUITAR entradas de una lista
    # desde un override, solo añadirlas, y por eso se parametrizan aquí.
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
